<!doctype html>
<!-- IT IS A DEMO INDEX.HTML FOR GIT PAGES -->
<!-- THE APP INDEX.HTML LOCATED IN /app/index.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./public/tree.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/treeselectjs/dist/treeselectjs.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/treeselectjs/dist/treeselectjs.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.2/build/styles/atom-one-light.min.css" />
    <link rel="stylesheet" href="./index.css" />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.2/build/highlight.min.js"></script>
    <script type="module" src="./index.js"></script>
    <title>Treeselect JS Demo</title>
    <meta
      name="description"
      content="Treeselect JS component. A multi-select js component with nested options. Full key support (ArrowUp, ArrowDown, Space, ArrowLeft, ArrowRight, Enter). Screen sensitive direction. Typescript support."
    />
    <base href="." />
  </head>
  <body>
    <main class="root">
      <header class="site-header">
        <a class="site-brand" href="./" aria-label="Treeselect JS home">
          <span class="site-brand__mark">T</span>
          <span>Treeselect JS</span>
        </a>
        <nav class="site-nav" aria-label="Project links">
          <a class="site-nav__link" href="https://github.com/dipson88/treeselectjs/tree/main/packages/treeselectjs#readme" target="_blank" rel="noreferrer">Docs</a>
          <a class="site-nav__link" href="https://github.com/dipson88/treeselectjs" target="_blank" rel="noreferrer">GitHub</a>
          <a class="site-nav__link" href="https://www.npmjs.com/package/treeselectjs" target="_blank" rel="noreferrer">npm</a>
          <a class="site-nav__link site-nav__link--coffee" href="https://www.buymeacoffee.com/dipson88" target="_blank" rel="noreferrer" aria-label="Buy me a coffee">
            <img class="site-nav__coffee-image" src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="" />
          </a>
        </nav>
      </header>

      <h1 class="root__title">Treeselect JS Demo</h1>

      <!-- Default section -->
      <section id="default-section" class="section">
        <p class="section__title">Treeselect with default props</p>
      </section>
      <div class="section__separator"></div>

      <!-- Slot section -->
      <section id="slot-section" class="section">
        <p class="section__title">Treeselect with slot</p>
      </section>
      <div class="section__separator"></div>

      <!-- Disabled section -->
      <section id="disabled-section" class="section">
        <p class="section__title">Treeselect with disabled</p>
      </section>
      <div class="section__separator"></div>

      <!-- Single select section -->
      <section id="single-select-section" class="section">
        <p class="section__title">Treeselect with single select prop</p>
      </section>
      <div class="section__separator"></div>

      <!-- Independent Nodes section -->
      <section id="independent-nodes-section" class="section">
        <p class="section__title">Treeselect with independent nodes prop</p>
      </section>
      <div class="section__separator"></div>

      <!-- Example with icons (workaround) -->
      <section id="with-icons-section" class="section" style="max-width: 1980px; margin: 0 auto">
        <p class="section__title">Treeselect with icons</p>
      </section>
    </main>
  </body>
</html>
